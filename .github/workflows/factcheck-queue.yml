# Rucna kontrola faktov vo fronte (ColdCase): Wikipedia + Groq (zadarmo) skontroluje vsetky nekontrolovane groq spisy
# v paper/case/queue. Opravene spisy ostanu vo fronte s "factcheck", zamietnute idu do paper/case/queue_rejected (nic sa nemaze).
# Nic nepublikuje a nerenderuje. Stav sa uklada spat do repozitara rovnako ako v paper-case.yml.
name: Factcheck queue (ColdCase)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Kolko spisov najviac skontrolovat (Groq free limit: radsej 3-5 naraz)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: stickman                    # rovnaka skupina ako paper-case.yml: nikdy suberzne (spolocny stav v repozitari)
  cancel-in-progress: false

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python zavislosti
        run: pip install -q requests

      - name: Kontrola faktov vo fronte
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          MODELS_BASE_URL: https://api.groq.com/openai/v1
          MODELS_MODEL: openai/gpt-oss-120b
          MODELS_FALLBACK: openai/gpt-oss-20b
        run: cd paper && python engine/factcheck.py --queue --max "${{ github.event.inputs.max || '5' }}"

      - name: Uloženie stavu
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A paper/case 2>/dev/null || true
          git commit -m "factcheck: fronta $(date -u +%F)" || echo "bez zmien"
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push && break || sleep 15; done
